<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mantra — Your Life, Organised</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="description" content="Mantra — All-in-one life assistant for bills, notes, reminders, and expenses.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Google Fonts: Inter + Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Material Icons (used by chat and other components) -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Critical inline styles: eliminate white-flash on select dropdowns before any JS or external CSS loads -->
  <style>
    :root { color-scheme: dark; }
    html.light-mode { color-scheme: light; }
    select {
      appearance: none;
      -webkit-appearance: none;
      background-color: #1e2336 !important;
      color: #e2e8f0 !important;
    }
    html.light-mode select {
      background-color: #f1f5f9 !important;
      color: #1e293b !important;
    }
    select option {
      background-color: #1e2336;
      color: #e2e8f0;
    }
    html.light-mode select option {
      background-color: #f1f5f9;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
